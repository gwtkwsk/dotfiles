    starshipTemplate: "dot_config/starship-nerd-font-symbols.toml"
    tmuxFlavor: "mocha"
    tmuxTemplate: "themes/tmux-catppuccin.conf.tmpl"
    yaziFlavor: "catppuccin-mocha"
    yaziTemplate: "themes/yazi-flavor.toml.tmpl"
