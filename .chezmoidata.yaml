# Allowed values for `theme`: `gruvbox-dark-medium`, `gruvbox-light-medium`, `catppuccin-frappe`, `catppuccin-latte`, `catppuccin-macchiato`, `catppuccin-mocha`.
# This single key controls theme variants across tmux, ghostty, nvim, starship and yazi.
theme: gruvbox-dark-medium

themePresets:
  gruvbox-dark-medium:
    codeColorTheme: "Gruvbox Dark Medium"
    codeIconTheme: ""
    ghosttyTheme: "Gruvbox Dark Medium"
    nvimGruvboxBackground: "dark"
    nvimGruvboxContrast: ""
    nvimTemplate: "themes/nvim-gruvbox.lua.tmpl"
    starshipPalette: ""
    starshipTemplate: "dot_config/starship-gruvbox.toml"
    tmuxGruvboxVariant: "dark"
    tmuxTemplate: "themes/tmux-gruvbox.conf.tmpl"
    yaziFlavor: "gruvbox-dark"
    yaziTemplate: "themes/yazi-flavor.toml.tmpl"
  gruvbox-light-medium:
    codeColorTheme: "Gruvbox Light Medium"
    codeIconTheme: ""
    ghosttyTheme: "Gruvbox Light Medium"
    nvimGruvboxBackground: "light"
    nvimGruvboxContrast: ""
    nvimTemplate: "themes/nvim-gruvbox.lua.tmpl"
    starshipPalette: ""
    starshipTemplate: "dot_config/starship-gruvbox-light.toml"
    tmuxGruvboxVariant: "light"
    tmuxTemplate: "themes/tmux-gruvbox.conf.tmpl"
    yaziTemplate: "themes/yazi-gruvbox-light.toml.tmpl"
  catppuccin-frappe:
    codeColorTheme: "Catppuccin Frappe"
    codeIconTheme: "Catppuccin Frappe"
    ghosttyTheme: "Catppuccin Frappe"
    nvimFlavor: "frappe"
    nvimTemplate: "themes/nvim-catppuccin.lua.tmpl"
    starshipPalette: "catppuccin_frappe"
    starshipTemplate: "dot_config/starship-nerd-font-symbols.toml"
    tmuxFlavor: "frappe"
    tmuxTemplate: "themes/tmux-catppuccin.conf.tmpl"
    yaziFlavor: "catppuccin-frappe"
    yaziTemplate: "themes/yazi-flavor.toml.tmpl"
  catppuccin-latte:
    codeColorTheme: "Catppuccin Latte"
    codeIconTheme: "Catppuccin Latte"
    ghosttyTheme: "Catppuccin Latte"
    nvimFlavor: "latte"
    nvimTemplate: "themes/nvim-catppuccin.lua.tmpl"
    starshipPalette: "catppuccin_latte"
    starshipTemplate: "dot_config/starship-nerd-font-symbols.toml"
    tmuxFlavor: "latte"
    tmuxTemplate: "themes/tmux-catppuccin.conf.tmpl"
    yaziFlavor: "catppuccin-latte"
    yaziTemplate: "themes/yazi-flavor.toml.tmpl"
  catppuccin-macchiato:
    codeColorTheme: "Catppuccin Macchiato"
    codeIconTheme: "Catppuccin Macchiato"
    ghosttyTheme: "Catppuccin Macchiato"
    nvimFlavor: "macchiato"
    nvimTemplate: "themes/nvim-catppuccin.lua.tmpl"
    starshipPalette: "catppuccin_macchiato"
    starshipTemplate: "dot_config/starship-nerd-font-symbols.toml"
    tmuxFlavor: "macchiato"
    tmuxTemplate: "themes/tmux-catppuccin.conf.tmpl"
    yaziFlavor: "catppuccin-macchiato"
    yaziTemplate: "themes/yazi-flavor.toml.tmpl"
  catppuccin-mocha:
    codeColorTheme: "Catppuccin Mocha"
    codeIconTheme: "Catppuccin Mocha"
    ghosttyTheme: "Catppuccin Mocha"
    nvimFlavor: "mocha"
    nvimTemplate: "themes/nvim-catppuccin.lua.tmpl"
